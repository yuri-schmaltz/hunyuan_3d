[mypy]
# Strict-by-default for code we own, lenient on third-party libraries we
# don't ship stubs for. The CI step calls mypy with --follow-imports=silent
# so transitive imports from upstream (shapegen, texgen, etc.) don't pollute
# the error stream.
python_version = 3.10
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_incomplete_stub = True
ignore_missing_imports = True
check_untyped_defs = True
disallow_incomplete_defs = False

# Files we don't want mypy to police (vendored Hunyuan3D + heavy ML
# entrypoints). These are excluded by mypy so transitive imports from
# them don't show up as errors when checking the new code.
[mypy-hy3dgen.shapegen]
ignore_errors = True

[mypy-hy3dgen.texgen]
ignore_errors = True

[mypy-hy3dgen.rembg]
ignore_errors = True

[mypy-hy3dgen.text2image]
ignore_errors = True

[mypy-hy3dgen.version]
ignore_errors = True

[mypy-hy3dgen.monitoring]
ignore_errors = True

[mypy-hy3dgen.inference]
ignore_errors = True

[mypy-hy3dgen.meshops]
ignore_errors = True

[mypy-launcher]
ignore_errors = True

[mypy-blender_addon]
ignore_errors = True
