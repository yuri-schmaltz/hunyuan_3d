name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main, "feature/**", "fix/**"]

# Cancel in-flight runs for the same branch on new pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Backend: pytest + mypy
  # ---------------------------------------------------------------------------
  backend:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    defaults:
      run:
        working-directory: ./

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install CPU-only PyTorch + API deps
        run: |
          python -m pip install --upgrade pip
          # CPU torch so the runner doesn't try to pull CUDA wheels.
          pip install --index-url https://download.pytorch.org/whl/cpu \
              torch torchvision
          # The rest of the test/typing deps. The Makefile uses
          # hy3dgen as the install target so we pick up the right
          # entry points + mypy.ini.
          pip install -e ".[dev]"
          # Plus the sse-starlette / fastapi / psutil the tests need.
          pip install sse-starlette fastapi uvicorn psutil

      - name: pytest
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/ -ra \
              --ignore=tests/test_texgen_loading.py \
              --ignore=tests/test_imports.py

      - name: mypy
        run: |
          python -m mypy --follow-imports=silent \
              --explicit-package-bases hy3dgen hy3dgen/api hy3dgen/cli.py

  # ---------------------------------------------------------------------------
  # Frontend: tsc + eslint + build
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./archeon_frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: archeon_frontend/package-lock.json

      - name: Install npm deps
        run: npm ci --no-audit --no-fund

      - name: tsc
        run: npx tsc -b --noEmit

      - name: eslint
        run: npx eslint .

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8081

  # ---------------------------------------------------------------------------
  # Docker build smoke-test (only on main + PRs to main)
  # ---------------------------------------------------------------------------
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        run: docker build -f Dockerfile -t archeon-api:ci .

      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t archeon-frontend:ci .
        env:
          VITE_API_URL: http://localhost:8081
