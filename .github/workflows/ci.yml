name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main, "feature/**", "fix/**"]

# Cancel in-flight runs for the same branch on new pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Backend: pytest + mypy
  # ---------------------------------------------------------------------------
  backend:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    defaults:
      run:
        working-directory: ./

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install CPU-only PyTorch + API deps
        run: |
          python -m pip install --upgrade pip
          # CPU torch so the runner doesn't try to pull CUDA wheels.
          pip install --index-url https://download.pytorch.org/whl/cpu \
              torch torchvision
          # The rest of the test/typing deps. The Makefile uses
          # hy3dgen as the install target so we pick up the right
          # entry points + mypy.ini.
          pip install -e ".[dev]"
          # Plus the sse-starlette / fastapi / psutil the tests need.
          pip install sse-starlette fastapi uvicorn psutil

      - name: pytest
        env:
          PYTHONPATH: .
        run: |
          # The full suite is split into a few sections so a single
          # failure points at the right module instead of dumping
          # 200 tracebacks.
          #
          # 1. Fast unit tests (manager, launcher, persistence,
          #    schemas, health, settings, sse, etc.). These are
          #    the CPU-only ones that should pass on every PR.
          echo "::group::core unit tests"
          python -m pytest tests/ -ra \
              --ignore=tests/test_texgen_loading.py \
              --ignore=tests/test_imports.py \
              --ignore=tests/test_text2image.py \
              --ignore=tests/test_memory_pressure.py \
              --ignore=tests/test_concurrent_api.py \
              --ignore=tests/test_sse_stress.py \
              --ignore=tests/test_eviction_under_load.py \
              -q
          echo "::endgroup::"
          #
          # 2. Stress / concurrency tests. These need a free port
          #    and the patched demo server (see tests/conftest.py
          #    and docs/demo/server_patched.py). They are slower
          #    and may flake on a busy CI runner, so we surface
          #    failures but don't fail the build.
          echo "::group::stress / concurrency tests"
          python -m pytest tests/test_concurrent_api.py \
              tests/test_sse_stress.py \
              tests/test_eviction_under_load.py \
              -v --timeout=120 || echo "::warning::stress tests had failures"
          echo "::endgroup::"
          #
          # 3. Memory-pressure tests. These insert 10k jobs into
          #    SQLite and need a working server. They depend on
          #    hardware speed (the rehydrate-speed assertion is
          #    >7k jobs/s, which a CPU-only CI runner may miss).
          #    Run them but don't fail the build on perf misses.
          echo "::group::memory pressure tests"
          python -m pytest tests/test_memory_pressure.py \
              -v --timeout=180 || echo "::warning::memory pressure tests had failures"
          echo "::endgroup::"

      - name: Show hardening test counts
        if: always()
        env:
          PYTHONPATH: .
        run: |
          # Quick smoke check that the new hardening suites (PRs
          # #13 and #14) didn't accidentally disappear. Useful as
          # a signal in the CI log even if a particular test
          # failed.
          echo "::group::hardening test summary"
          python -m pytest \
              tests/test_launcher_hardening.py \
              tests/test_manager_hardening.py \
              --collect-only -q
          echo "::endgroup::"

      - name: mypy
        run: |
          python -m mypy --follow-imports=silent \
              --explicit-package-bases hy3dgen hy3dgen/api hy3dgen/cli.py

      - name: ruff
        run: |
          pip install ruff
          ruff check hy3dgen tests
          ruff format --check hy3dgen tests

  # ---------------------------------------------------------------------------
  # Frontend: tsc + eslint + build
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./archeon_frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: archeon_frontend/package-lock.json

      - name: Install npm deps
        run: npm ci --no-audit --no-fund

      - name: tsc
        run: npx tsc -b --noEmit

      - name: eslint
        run: npx eslint .

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8081

  # ---------------------------------------------------------------------------
  # Docker build smoke-test (only on main + PRs to main)
  # ---------------------------------------------------------------------------
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        run: docker build -f Dockerfile -t archeon-api:ci .

      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t archeon-frontend:ci .
        env:
          VITE_API_URL: http://localhost:8081
