# =============================================================================
# Archeon 3D — full stack
# =============================================================================
# Brings up:
#   - api      : the FastAPI backend (with the Hunyuan3D model worker)
#   - frontend : the Vite/React UI, served by nginx, proxies /v1 to api
#   - (optional) caddy : TLS terminator + public hostname, off by default
#
# Quick start:
#   cp .env.example .env
#   # edit .env to set ARCHEON_API_KEY, ARCHEON_DEVICE, etc.
#   docker compose up --build
# =============================================================================

name: archeon

x-backend-env: &backend-env
  ARCHEON_HOST: 0.0.0.0
  ARCHEON_PORT: 8081
  # If you have an NVIDIA GPU, the api service uses the cuda base image.
  # On CPU-only hosts, set ARCHEON_DEVICE=cpu (or rely on the env var).
  ARCHEON_DEVICE: ${ARCHEON_DEVICE:-cuda}
  # API key (set in .env). When empty, auth is disabled (dev only).
  ARCHEON_API_KEY: ${ARCHEON_API_KEY:-}
  ARCHEON_CORS_ORIGINS: ${ARCHEON_CORS_ORIGINS:-http://localhost}
  # Where generated meshes go (mounted as a volume so they survive restarts).
  ARCHEON_SAVE_DIR: /data/meshes
  # SQLite-backed persistence.
  ARCHEON_JOB_DB: /data/state/jobs.db
  # Optional file log.
  ARCHEON_LOG_FILE: /data/logs/archeon-api.log
  ARCHEON_LOG_LEVEL: ${ARCHEON_LOG_LEVEL:-INFO}

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: archeon-api:local
    container_name: archeon-api
    restart: unless-stopped
    environment:
      <<: *backend-env
    volumes:
      - archeon-data:/data
      # If you already have models downloaded, mount your HF cache here.
      - ${HF_HOME:-./.hf-cache}:/root/.cache/huggingface
    ports:
      # Expose the API directly too (useful for curl / external clients).
      - "${ARCHEON_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8081/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 60s  # model load can be slow on first run
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8081}
    image: archeon-frontend:local
    container_name: archeon-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"

  # Optional: TLS terminator. Uncomment to enable.
  # caddy:
  #   image: caddy:2-alpine
  #   container_name: archeon-caddy
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy-data:/data
  #     - caddy-config:/config
  #   depends_on:
  #     - frontend

volumes:
  archeon-data:
    # Persistent state (meshes, SQLite DB, logs).
  # caddy-data:
  # caddy-config:
