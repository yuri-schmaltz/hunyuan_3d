[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hy3dgen"
version = "2.1.0-archeon7"
description = "Hunyuan3D 2.0 with the Archeon API, frontend, persistence, and real-time streaming layer."
readme = "ARCHEON_README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.13"
authors = [
    { name = "Archeon contributors" },
    { name = "Tencent Hunyuan3D team", email = "3d@tencent.com" },
]
keywords = ["3d", "mesh", "diffusion", "hunyuan", "archeon", "sse", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: 3D Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime dependencies. The full list (including heavy ML deps) lives
# in ``requirements.txt``; we keep the API surface dependencies here so
# `pip install -e .` works for someone who only wants the Archeon API
# server (no model loading).
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.10,<3",
    "sse-starlette>=2.0.0",
    "psutil>=5.9",
    "PyYAML>=6.0",
    "huggingface_hub>=0.20",
    "numpy",
    "requests",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Full ML stack (used by the inference worker).
ml = [
    "torch>=2.0",
    "torchvision",
    "transformers==4.49.0",
    "diffusers",
    "einops",
    "opencv-python",
    "omegaconf",
    "diso",
    "tqdm",
    "trimesh",
    "pymeshlab",
    "pygltflib",
    "xatlas",
    "rembg",
    "onnxruntime",
    "mmgp==3.2.7",
    "gradio",
    "gradio_litmodel3d",
    "ninja",
    "pybind11",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "httpx",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx",
]

[project.urls]
Homepage = "https://github.com/yuri-schmaltz/my-hunyuan-3D"
Issues = "https://github.com/yuri-schmaltz/my-hunyuan-3D/issues"
"Archeon docs" = "https://github.com/yuri-schmaltz/my-hunyuan-3D/blob/main/ARCHEON_README.md"

# ---------------------------------------------------------------------------
# Entry points
# ---------------------------------------------------------------------------
[project.scripts]
hy3dgen-api = "hy3dgen.api.server:main"
hy3dgen-cli = "hy3dgen.cli:main"
hy3dgen-launcher = "launcher:main"

# ---------------------------------------------------------------------------
# Tooling configuration (mypy / pytest)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
follow_imports = "silent"
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false
exclude = [
    "build/",
    "dist/",
    ".venv/",
    "tests/",
    "examples/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "integration: marks integration tests (deselect with '-m \"not integration\"')",
]

# ---------------------------------------------------------------------------
# setuptools package config
# ---------------------------------------------------------------------------
[tool.setuptools]
packages = [
    "hy3dgen",
    "hy3dgen.api",
    "hy3dgen.meshops",
]
include-package-data = true

[tool.setuptools.package-data]
"hy3dgen" = ["py.typed", "*.pyi"]
"hy3dgen.api" = ["*.yaml", "*.json"]
