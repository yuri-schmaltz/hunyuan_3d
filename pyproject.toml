[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hy3dgen"
version = "2.1.0-archeon7"
description = "Hunyuan3D 2.0 with the Archeon API, frontend, persistence, and real-time streaming layer."
readme = "ARCHEON_README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.13"
authors = [
    { name = "Archeon contributors" },
    { name = "Tencent Hunyuan3D team", email = "3d@tencent.com" },
]
keywords = ["3d", "mesh", "diffusion", "hunyuan", "archeon", "sse", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: 3D Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime dependencies. The full list (including heavy ML deps) lives
# in ``requirements.txt``; we keep the API surface dependencies here so
# `pip install -e .` works for someone who only wants the Archeon API
# server (no model loading).
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.10,<3",
    "sse-starlette>=2.0.0",
    "psutil>=5.9",
    "PyYAML>=6.0",
    "huggingface_hub>=0.20",
    "numpy",
    "requests",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "prometheus-client>=0.20",
    "pydantic-settings>=2.0",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
# Full ML stack (used by the inference worker).
ml = [
    "torch>=2.0",
    "torchvision",
    "transformers==4.49.0",
    "diffusers",
    "einops",
    "opencv-python",
    "omegaconf",
    "diso",
    "tqdm",
    "trimesh",
    "pymeshlab",
    "pygltflib",
    "xatlas",
    "rembg",
    "onnxruntime",
    "mmgp==3.2.7",
    "gradio",
    "gradio_litmodel3d",
    "ninja",
    "pybind11",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "httpx",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx",
]

[project.urls]
Homepage = "https://github.com/yuri-schmaltz/my-hunyuan-3D"
Issues = "https://github.com/yuri-schmaltz/my-hunyuan-3D/issues"
"Archeon docs" = "https://github.com/yuri-schmaltz/my-hunyuan-3D/blob/main/ARCHEON_README.md"

# ---------------------------------------------------------------------------
# Entry points
# ---------------------------------------------------------------------------
[project.scripts]
hy3dgen-api = "hy3dgen.api.server:main"
hy3dgen-cli = "hy3dgen.cli:main"
hy3dgen-launcher = "launcher:main"

# ---------------------------------------------------------------------------
# Tooling configuration (mypy / pytest)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
follow_imports = "silent"
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = true
warn_redundant_casts = true
warn_incomplete_stub = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
exclude = [
    "build/",
    "dist/",
    ".venv/",
    "tests/",
    "examples/",
]

[[tool.mypy.overrides]]
module = [
    "hy3dgen.shapegen",
    "hy3dgen.texgen",
    "hy3dgen.rembg",
    "hy3dgen.text2image",
    "hy3dgen.version",
    "hy3dgen.monitoring",
    "hy3dgen.inference",
    "hy3dgen.meshops",
    "launcher",
    "blender_addon",
]
ignore_errors = true

# ---------------------------------------------------------------------------
# Ruff — fast linter + formatter (replaces flake8/isort/pyupgrade/...)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "build",
    "dist",
    ".venv",
    "archeon_frontend",
    "examples",
    "tests/fixtures",
]

[tool.ruff.lint]
# Strict-ish defaults. Add rules rather than removing them.
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade (catches the Optional[X] -> X | None refactor)
    "SIM",    # flake8-simplify
    "C4",     # flake8-comprehensions
    "RUF",    # ruff-specific
    "N",      # pep8-naming
    "ASYNC",  # flake8-async
    "TID",    # flake8-tidy-imports
]
ignore = [
    "E501",   # line length is handled by formatter
    "B008",   # FastAPI's Depends() in defaults is intentional
    "SIM108", # sometimes ternary hurts readability
    "N818",   # exception name suffix — has false positives
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "N802", "N803"]  # asserts + mock names are fine in tests
"examples/*" = ["B", "N"]              # examples can be sloppy
"launcher.py" = ["B", "N", "E", "W", "F"]  # upstream code, leave alone
"blender_addon.py" = ["B", "N", "E", "W", "F"]

[tool.ruff.lint.isort]
known-first-party = ["hy3dgen"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "integration: marks integration tests (deselect with '-m \"not integration\"')",
]

# ---------------------------------------------------------------------------
# setuptools package config
# ---------------------------------------------------------------------------
[tool.setuptools]
packages = [
    "hy3dgen",
    "hy3dgen.api",
    "hy3dgen.meshops",
]
include-package-data = true

[tool.setuptools.package-data]
"hy3dgen" = ["py.typed", "*.pyi"]
"hy3dgen.api" = ["*.yaml", "*.json"]
